# Add this location to the HTTPS server already proxying your Readest origin.
# The proxy must share the library container's Docker network.
location /library-files/ {
    proxy_pass http://library:8080;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 4g;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Transfer URLs contain temporary bearer capabilities.
    access_log off;
}
# Do not route /v1/* to this service. Those are private adapter RPCs.
